# Configuración del pipeline de imágenes de producto.
# Estos valores son los defaults (src/imagenes_producto/config.py): cambia solo lo que necesites.
# El formato de salida sigue el prompt actual: 1000×1000, WEBP de hasta 50 KB, fondo blanco.

[lienzo]
ancho = 1000                  # px
alto = 1000                   # px
fondo = "#FFFFFF"             # color hex, o "transparente" (solo con png o webp)

[producto]
altura = 0.90                 # fracción del alto del lienzo que ocupa el producto (900 px de 1000); la misma en todas las vistas y modelos
ancho_max = 0.90              # fracción máxima del ancho; si el producto no cabe, se achica y se alerta

[portada]                     # se compone con la Trasera y la Frontal, del mismo alto; no la genera la IA
solape = 0.1667               # fracción del ancho del teléfono de adelante que tapa al de atrás: 0 = se tocan,
                              # 0.1667 = de la trasera se ve 5/6, como la referencia; negativo = separados (de -0.5 a 0.95).
                              # Para elegir: imgprod portada --solape 0,0.1667,0.3 ; para aplicar: imgprod portada
desfase_vertical = 0.0        # fracción del alto: positivo baja la frontal respecto de la trasera; 0 = alineadas
adelante = "frontal"          # cuál queda encima: "frontal" o "trasera"
lado_trasera = "izquierda"    # "izquierda" o "derecha"
frontal = "apagada"           # qué Frontal va en la Portada: "apagada" o "wallpaper" (debe estar en pantalla.variantes)

[pantalla]                    # pantalla de la Frontal
variantes = ["apagada", "wallpaper"]   # qué Frontales salen: "apagada" → …-Frontal, "wallpaper" → …-Frontal-Wallpaper.
                              # Con "wallpaper", la IA genera la Frontal con la pantalla en color_croma y de esa única
                              # imagen salen las dos, con la misma geometría. Solo ["apagada"]: la IA la genera apagada.
color_croma = "#00FF00"       # color plano que la IA pone en la pantalla y el script reemplaza
tolerancia_tono = [18, 40]    # grados de tono: hasta el primero es croma, desde el segundo no (súbelos si la IA
                              # entrega un verde menos puro)
wallpapers = "estilo/wallpapers"   # carpeta: se busca <producto>.jpg, luego <modelo>.jpg y luego _default.jpg
                              # (también png o webp); o un archivo, para usar el mismo en todos
ancla_wallpaper = "centro"    # si el wallpaper no calza con la pantalla, qué parte se conserva: "centro" o "arriba"
color_apagada = "#0B0B0F"     # pantalla apagada que se arma desde el croma
reflejo_apagada = 0.06        # reflejo diagonal de la pantalla apagada: 0 = negro plano

[sombra]                      # sombra de contacto bajo el producto; medidas en fracción del alto del producto
activa = true                 # ajustada a las referencias de estilo (estilo/referencias/)
opacidad = 0.24               # 0-1: oscuridad máxima
base = 0.024                  # alto de la silueta aplastada de la que sale la sombra
desplazamiento = 0.004        # cuánto baja la sombra respecto del borde inferior del producto
desenfoque_x = 0.029          # difuminado horizontal
desenfoque_y = 0.018          # difuminado vertical

[recorte]
umbral_alfa = 128             # 1-255: opacidad desde la que un píxel cuenta como producto al medir el contorno
objeto_min = 0.005            # se borran las manchas más chicas que esta fracción del objeto principal
rellenar_interior = true      # el cuerpo del producto queda 100 % opaco; solo el contorno conserva la transparencia suave

[quitar_fondo]
metodo = "auto"               # "auto": usa la transparencia si la imagen la trae; si no, rembg
                              # "alfa": exige transparencia · "rembg": siempre segmenta con rembg
modelo = "birefnet-general"   # modelo de rembg (MIT). "birefnet-general-lite" es más liviano. No usar bria-rmbg: no es de uso comercial
limpiar_bordes = true         # quita el color del fondo que queda pegado en los bordes suaves del recorte

[salida]
formato = "webp"              # "webp", "jpg" o "png"
calidad = 90                  # calidad máxima (jpg y webp), 1-100
calidad_min = 60              # para cumplir el peso máximo se baja la calidad hasta acá; si aun así pesa más, se alerta
peso_max_kb = 50              # 0 = sin límite
nombre = "{producto}-Version-Final-{vista}"   # nombre de cada imagen final, sin extensión

[generar]                     # etapa 1: generar las vistas con IA
proveedor = "openai"
modelo = "gpt-image-2.5-sunburst"   # el más fiel de OpenAI (sept. 2026); "gpt-image-2.5-flare" es la variante rápida, mismo precio
calidad = "high"              # "low", "medium", "high", "xhigh", "max" o "auto": más calidad, más costo
medidas = "1024x1536"         # px de la imagen generada; sobra para el lienzo final de 1000×1000
candidatos = 1                # imágenes por vista y llamada (1-10); las extra quedan como <Vista>-2.png, …
fondo = "transparente"        # "transparente" (la etapa 2 no necesita quitar el fondo) o "blanco"
vistas = ["Lateral", "Frontal", "Trasera"]   # la Portada no se genera: se compone
prompts = "estilo/prompts"    # comun.md + un archivo por vista
referencias = "estilo/referencias"   # una imagen de estilo por vista (*-Lateral, *-Frontal, *-Trasera)
rasgos = "estilo/rasgos.toml" # rasgos clave por modelo (opcional)
original_min = 800            # px: si en el original el equipo ocupa menos que esto (lado mayor), se alerta
precio_texto_entrada = 5.0    # US$ por millón de tokens (OpenAI, gpt-image-2.5, al 2026-09-24)
precio_imagen_entrada = 8.0
precio_imagen_salida = 30.0

[alertas]
ampliacion_max = 1.10         # si el producto se amplía más que este factor, se alerta (hasta 10 % no se nota)
margen_borde = 2              # px: si el producto queda a esta distancia o menos del borde de la imagen de entrada, se alerta
diferencia_proporcion = 0.03  # diferencia máxima de proporción ancho/alto entre la frontal y la trasera (deberían ser iguales)
