[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "imagenes-producto"
version = "0.1.0"
description = "Pipeline de imágenes de producto de Reuse: vistas generadas con IA y geometría estandarizada por script."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "openai>=3.19",
    "pillow>=11.0",
    "python-dotenv>=1.0",
    "rembg[cpu]>=2.0.85",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
imgprod = "imagenes_producto.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
